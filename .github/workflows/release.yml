name: Draft release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set up ExifTool 13.58
        run: |
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/exiftool.tar.gz" https://codeload.github.com/exiftool/exiftool/tar.gz/refs/tags/13.58
          echo "34f8e52f5b11806eba1174601bf38801508d4f05f3fef2265b3ce8e1079007b5  $RUNNER_TEMP/exiftool.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/exiftool.tar.gz" -C "$RUNNER_TEMP"
          echo "EXIFTOOL=$RUNNER_TEMP/exiftool-13.58/exiftool" >> "$GITHUB_ENV"
      - run: npm test
      - name: Check release tag
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('manifest.json', 'utf8'));
          assert.equal(process.env.GITHUB_REF_NAME, manifest.version, 'Tag must match manifest.json without a v prefix');
          NODE
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --draft main.js manifest.json styles.css
